name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the source distribution and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(ls dist/giftag-*.tar.gz | sed 's/.*giftag-\(.*\)\.tar\.gz/\1/')
          test "v$version" = "$GITHUB_REF_NAME" || test "$version" = "$GITHUB_REF_NAME"
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          cd "$RUNNER_TEMP"
          giftag version
          python -m pytest -p no:cacheprovider "$GITHUB_WORKSPACE/tests/test_giftag.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/giftag/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
