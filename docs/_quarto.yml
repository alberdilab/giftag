project:
  type: website
  output-dir: _site
  resources:
    - site.js

website:
  title: giftag
  site-url: https://alberdilab.github.io/giftag/
  favicon: assets/logo.svg
  search:
    location: navbar
    type: textbox
  navbar:
    pinned: true
    background: light
    foreground: dark
    logo: assets/logo.svg
    logo-alt: giftag logo
    left:
      - text: Get started
        href: get-started.qmd
      - text: Commands
        href: commands.qmd
      - text: Output and coverage
        menu:
          - text: Output files
            href: output.qmd
          - text: Marker coverage
            href: coverage.qmd
          - text: Methods and validation
            href: methods.qmd
      - text: Benchmark
        href: benchmark.qmd
      - text: Into gifter
        menu:
          - text: Take the marker table into gifter
            href: with-gifter.qmd
          - text: ---
          - text: gifter documentation
            href: https://alberdilab.github.io/gifter/
    right:
      - text: gifter docs ↗
        href: https://alberdilab.github.io/gifter/
        aria-label: Continue to the gifter documentation
      - icon: github
        href: https://github.com/alberdilab/giftag
        aria-label: giftag source on GitHub
  page-footer:
    left: Developed by Antton Alberdi.
    right: "giftag prepares genomic evidence for [gifter](https://alberdilab.github.io/gifter/) · [Source](https://github.com/alberdilab/giftag)"

language:
  search-text-placeholder: Search for

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-title: On this page
    code-copy: true
    include-after-body:
      text: |
        <script src="site.js"></script>
