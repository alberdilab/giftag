[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "giftag"
dynamic = ["version"]
description = "Annotate genomes with exactly the markers gifter evaluates."
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Antton Alberdi" }]
requires-python = ">=3.9"
dependencies = [
    "pyhmmer>=0.12",
    "pyrodigal>=3.5",
    "rich>=13",
    "typer>=0.12,<1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/alberdilab/giftag"
Documentation = "https://alberdilab.github.io/giftag/"
Changelog = "https://github.com/alberdilab/giftag/blob/main/CHANGELOG.md"
gifter = "https://github.com/alberdilab/gifter"

[project.scripts]
giftag = "giftag.cli:main"

[tool.hatch.version]
path = "src/giftag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/giftag"]

# The source distribution carries the package and its offline tests. The
# benchmarks and the documentation site stay in the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/src/giftag",
    "/tests/conftest.py",
    "/tests/test_giftag.py",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
